name: Bug report
description: Something does not work as it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Security problems must **not** be reported here: see the [security policy](https://github.com/Dagadam/dagadyn/security/policy).
        You can write in English or Italian.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Which property, curve and start did the object have? If it happens only with one model, attach a small model that shows the problem.
      placeholder: |
        1. Select a group and add …
        2. Press ▶ …
        3. …
    validations:
      required: true
  - type: input
    id: dagadyn
    attributes:
      label: DagaDyn version
      description: Extensions › Extension Manager shows it next to DagaDyn.
      placeholder: "0.2.0"
    validations:
      required: true
  - type: dropdown
    id: dagawasd
    attributes:
      label: DagaWASD
      description: Did it happen together with DagaWASD (walking, exploring, paths, videos)?
      options:
        - "No"
        - "Yes"
        - DagaWASD is not installed
    validations:
      required: true
  - type: input
    id: sketchup
    attributes:
      label: SketchUp version
      placeholder: "SketchUp 2024 (24.0.594)"
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Operating system
      placeholder: "Windows 11 23H2"
  - type: textarea
    id: log
    attributes:
      label: Error log
      description: |
        Animation panel › System › Error log › Copy, then paste it here.
        **Before posting**, replace your user name in the paths (for example `C:/Users/YourName/…` → `C:/Users/USER/…`).
      render: text
  - type: textarea
    id: more
    attributes:
      label: Anything else
      description: Screenshots, a short video, other extensions installed…
