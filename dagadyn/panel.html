/* ═══════════════════════════════════════════════════════════════
   CURVE — lo stesso algoritmo di lib/curves.rb (PCHIP con punti ad
   angolo). Ciò che si disegna qui è ciò che il motore applica: se si
   cambia una delle due copie va cambiata anche l'altra.
   tools/test_curves.rb confronta le due fra i marcatori CURVE-BEGIN/END.
═══════════════════════════════════════════════════════════════ */
/* CURVE-BEGIN */
const CURVE_MAX_PTS = 32, CURVE_MIN_DX = 0.005, CURVE_Y_MIN = -1, CURVE_Y_MAX = 2;

function curveSanitize(pts){
  if(!Array.isArray(pts)) pts = [];
  const inner = [];
  pts.forEach(p => {
    if(!Array.isArray(p) || p.length < 2) return;
    let x = p[0], y = p[1];
    if(typeof x !== 'number' || typeof y !== 'number' || !isFinite(x) || !isFinite(y)) return;
    y = Math.min(CURVE_Y_MAX, Math.max(CURVE_Y_MIN, y));
    if(x <= CURVE_MIN_DX || x >= 1 - CURVE_MIN_DX) return;
    inner.push(p[2] === 1 ? [x, y, 1] : [x, y]);
  });
  inner.sort((a, b) => a[0] - b[0]);
  let out = [[0, 0]];
  inner.forEach(p => { if(p[0] - out[out.length - 1][0] >= CURVE_MIN_DX) out.push(p); });
  while(out.length > 1 && 1 - out[out.length - 1][0] < CURVE_MIN_DX) out.pop();
  out.push([1, 1]);
  if(out.length > CURVE_MAX_PTS) out = out.slice(0, CURVE_MAX_PTS - 1).concat([out[out.length - 1]]);
  return out;
}

function pchipEnd(h0, h1, d0, d1){
  const m = ((2 * h0 + h1) * d0 - h0 * d1) / (h0 + h1);
  if(Math.sign(m) !== Math.sign(d0)) return 0;
  if(Math.sign(d0) !== Math.sign(d1) && Math.abs(m) > Math.abs(3 * d0)) return 3 * d0;
  return m;
}

function curveTangents(pts){
  const n = pts.length, h = [], d = [], m = new Array(n).fill(0);
  for(let k = 0; k < n - 1; k++){
    h.push(pts[k + 1][0] - pts[k][0]);
    d.push((pts[k + 1][1] - pts[k][1]) / h[k]);
  }
  if(n === 2){ m[0] = m[1] = d[0]; }
  else {
    for(let k = 1; k < n - 1; k++){
      const a = d[k - 1], b = d[k];
      if(a * b <= 0) m[k] = 0;
      else {
        const w1 = 2 * h[k] + h[k - 1], w2 = h[k] + 2 * h[k - 1];
        m[k] = (w1 + w2) / (w1 / a + w2 / b);
      }
    }
    m[0] = pchipEnd(h[0], h[1], d[0], d[1]);
    m[n - 1] = pchipEnd(h[n - 2], h[n - 3], d[n - 2], d[n - 3]);
  }
  const mi = m.slice(), mo = m.slice();
  for(let k = 1; k < n - 1; k++){
    if(pts[k][2] !== 1) continue;
    mi[k] = d[k - 1]; mo[k] = d[k];
  }
  return [mi, mo];
}

function curvePrepare(pts){
  pts = curveSanitize(pts);
  const [mi, mo] = curveTangents(pts);
  return {pts, mi, mo};
}

function curveEval(c, u){
  const pts = c.pts;
  if(u <= 0) return pts[0][1];
  if(u >= 1) return pts[pts.length - 1][1];
  let k = 0;
  while(k < pts.length - 2 && u > pts[k + 1][0]) k++;
  const [x0, y0] = pts[k], [x1, y1] = pts[k + 1];
  const hh = x1 - x0, t = (u - x0) / hh, t2 = t * t, t3 = t2 * t;
  return (2 * t3 - 3 * t2 + 1) * y0 + (t3 - 2 * t2 + t) * hh * c.mo[k] +
         (-2 * t3 + 3 * t2) * y1 + (t3 - t2) * hh * c.mi[k + 1];
}
/* CURVE-END */

/* Tracciato SVG di una curva in un riquadro w×h (y da lo a hi) */
function curvePath(pts, w, h, lo, hi, pad){
  const c = curvePrepare(pts), N = 64, p = pad || 0;
  let s = '';
  for(let i = 0; i <= N; i++){
    const u = i / N, y = curveEval(c, u);
    const px = p + u * (w - 2 * p), py = p + (hi - y) / (hi - lo) * (h - 2 * p);
    s += (i ? 'L' : 'M') + px.toFixed(1) + ' ' + py.toFixed(1);
  }
  return s;
}
function curveBounds(pts){
  let lo = 0, hi = 1;
  pts.forEach(p => { lo = Math.min(lo, p[1]); hi = Math.max(hi, p[1]); });
  return [lo, hi];
}
function curveThumb(pts, w, h){
  const [lo0, hi0] = curveBounds(pts), m = (hi0 - lo0) * 0.12, lo = lo0 - m, hi = hi0 + m, P = 4;
  const yl = v => (P + (hi - v) / (hi - lo) * (h - 2 * P)).toFixed(1);
  return `<svg viewBox="0 0 ${w} ${h}"><line x1="0" x2="${w}" y1="${yl(0)}" y2="${yl(0)}"/>`
       + `<line x1="0" x2="${w}" y1="${yl(1)}" y2="${yl(1)}"/>`
       + `<path d="${curvePath(pts, w, h, lo, hi, P)}"/></svg>`;
}
function presetName(id){ return T('cv.' + (id || 'custom')); }

/* ═══════════════════════════════════════════════════════════════
   PROPRIETÀ E UNITÀ
   I valori arrivano e ripartono nelle unità interne (lib/tracks.rb):
   lunghezze in pollici, angoli in gradi, scala ×, opacità 0–1. Qui si
   mostrano nell'unità del modello (setUnit) e l'opacità in %.
═══════════════════════════════════════════════════════════════ */
const PROPS = {pos_x:'length', pos_y:'length', pos_z:'length', move_x:'length', move_y:'length', move_z:'length',
               rot_x:'angle', rot_y:'angle', rot_z:'angle',
               size_x:'length', size_y:'length', size_z:'length', scale:'factor', color:'color', opacity:'ratio',
               visible:'bool', tag:'tag'};
const PROP_GROUPS = [['move', ['move_x','move_y','move_z']], ['pos', ['pos_x','pos_y','pos_z']],
                     ['rot', ['rot_x','rot_y','rot_z']], ['size', ['size_x','size_y','size_z','scale']],
                     ['look', ['color','opacity','visible','tag']]];
/* Un piano di sezione si sposta e si accende/spegne (SECTION_PROPS in lib/config.rb) */
const SECTION_PROPS = ['move_x','move_y','move_z','visible'];
const LEN_DEC = {mm:0, cm:1, m:3, in:2, ft:3, yd:3};
let UNIT = {label:'m', factor:39.37007874};

function setUnit(u){ if(u && u.factor) UNIT = u; }
function kindOf(p){ return PROPS[p]; }
function toDisp(p, v){
  const k = kindOf(p);
  return k === 'length' ? v / UNIT.factor : k === 'ratio' ? v * 100 : v;
}
function fromDisp(p, x){
  const k = kindOf(p);
  return k === 'length' ? x * UNIT.factor : k === 'ratio' ? x / 100 : x;
}
function unitOf(p){
  const k = kindOf(p);
  return k === 'length' ? UNIT.label : k === 'angle' ? '°' : k === 'factor' ? '×' : k === 'ratio' ? '%' : '';
}
function decOf(p){
  const k = kindOf(p);
  return k === 'length' ? (LEN_DEC[UNIT.label] !== undefined ? LEN_DEC[UNIT.label] : 2) : k === 'angle' ? 1 : k === 'factor' ? 2 : 0;
}
function fmtVal(p, v){
  if(kindOf(p) === 'bool') return T(v >= 0.5 ? 'vb.on' : 'vb.off');
  if(typeof v !== 'number') return String(v || T('vb.untagged'));
  return toDisp(p, v).toFixed(decOf(p));
}
function fmtSec(s){ return (+s).toFixed(2); }

/* Valore iniziale proposto per lo stato di arrivo di una traccia nuova:
   abbastanza diverso da vedersi subito. */
function suggestTo(p, rest){
  if(p.startsWith('move')) return 39.37;           // 1 m
  switch(kindOf(p)){
    case 'bool':   return rest >= 0.5 ? 0 : 1;
    case 'tag':    return ((SEL.tags || []).find(n => n !== rest)) || rest;
    case 'length': return p.startsWith('size') ? (rest > 0.001 ? rest * 1.5 : 39.37) : rest + 39.37;
    case 'angle':  return 90;
    case 'factor': return 1.5;
    case 'ratio':  return rest > 0.5 ? 0.2 : 1;
    case 'color':  return rest && rest.toLowerCase() !== '#e85d4a' ? '#e85d4a' : '#4a8de8';
  }
  return rest;
}

/* ═══════════════════════════════════════════════════════════════
   TIMELINE
   Ruby manda setTransport({state, t, total, loops}) durante la
   riproduzione (panel_fps volte al secondo) e a ogni comando. Mentre
   si trascina il cursore gli aggiornamenti in arrivo non lo spostano.
═══════════════════════════════════════════════════════════════ */
let TP = {state:'stop', t:0, total:0, loops:false}, SCRUB = false, scrubLast = 0, scrubTimer = null;
function setTransport(s){
  TP = Object.assign(TP, s || {});
  const play = TP.state === 'play', sl = document.getElementById('tpSlider');
  const total = Math.max(TP.total || 0, 0);
  sl.max = total > 0 ? total : 1;
  if(!SCRUB) sl.value = Math.min(TP.t, sl.max);
  sl.disabled = total <= 0;
  document.getElementById('tpTime').innerHTML = `<b>${fmtSec(TP.t)}</b> / ${fmtSec(total)} s${TP.loops ? ' ↻' : ''}`;
  const pb = document.getElementById('tpPlay');
  pb.textContent = play ? '⏸' : '▶';
  pb.title = T(play ? 'tp.pause' : 'tp.play');
  const st = document.getElementById('tpStop');
  st.disabled = TP.state === 'stop';
  st.title = T('tp.stop');
  const bk = document.getElementById('tpBake');
  bk.disabled = TP.state === 'stop';
  bk.textContent = T('tp.bake'); bk.title = T('tp.bake_h');
  sl.title = T('tp.scrub');
  setRunning(TP.state);
}
/* Scrub: al più ~30 richieste al secondo, l'ultima sempre */
function scrubInput(el){
  SCRUB = true;
  const v = +el.value, now = performance.now();
  document.getElementById('tpTime').innerHTML = `<b>${fmtSec(v)}</b> / ${fmtSec(TP.total || 0)} s`;
  clearTimeout(scrubTimer);
  if(now - scrubLast > 33){ scrubLast = now; sketchup.seek(v); }
  else scrubTimer = setTimeout(() => { scrubLast = performance.now(); sketchup.seek(v); }, 35);
}
function scrubEnd(el){
  clearTimeout(scrubTimer);
  sketchup.seek(+el.value);
  SCRUB = false;
}
/* Comandi della timeline: prima le modifiche alle tracce ancora in attesa
   (Ruby esegue le chiamate nell'ordine in cui arrivano) */
function tpCmd(name){
  if(DIRTY) saveTracks();
  sketchup[name]();
}
function setRunning(state){
  const btn = document.getElementById('btnT'), dot = document.getElementById('dot');
  if(!btn) return;
  if(state === 'play'){
    btn.textContent = '⏸ ' + T('ui.pause'); btn.className = 'btn btn-stop';
    dot.textContent = '● ' + T('ui.playing'); dot.className = 'dot on';
  } else {
    btn.textContent = '▶ ' + T('ui.play'); btn.className = 'btn btn-go';
    dot.textContent = '● ' + T(state === 'pause' ? 'ui.paused' : 'ui.idle'); dot.className = 'dot' + (state === 'pause' ? ' on' : '');
  }
}

/* ═══════════════════════════════════════════════════════════════
   OGGETTO SELEZIONATO
   setSelection da Ruby: {kind:'none'|'raw'|'multi'|'obj', …}; per 'obj'
   pid (persistent_id), name, type, rest (valori di riposo), data
   ({pivot, tracks}) e live (fa parte della sessione in corso).
   Ogni modifica va a Ruby (save_tracks) dopo una breve pausa: una voce
   di annullamento per gruppo di battute, non per tasto.
═══════════════════════════════════════════════════════════════ */
let SEL = {kind:'none'}, DIRTY = false, tracksTimer = null;

function setSelection(s){
  s = s || {kind:'none'};
  // stesso oggetto e nessuna modifica nostra in arrivo: si aggiornano solo
  // riposo e stato, senza ridisegnare (non si perde il punto in cui si scrive)
  if(s.kind === 'obj' && SEL.kind === 'obj' && s.pid === SEL.pid && (s.multi || 0) === (SEL.multi || 0) &&
     JSON.stringify(s.others) === JSON.stringify(SEL.others) &&
     (DIRTY || JSON.stringify(s.data) === JSON.stringify(SEL.data))){
    SEL.rest = s.rest; SEL.live = s.live; SEL.name = s.name; SEL.tags = s.tags;
    const b = document.getElementById('obLive');
    if(b) b.hidden = !SEL.live;
    return;
  }
  if(DIRTY) saveTracks();          // l'oggetto precedente prima di cambiare
  SEL = s;
  renderObj();
  markSceneCur();
}

/* preview: il tempo locale dello stato appena cambiato (anteprima nella
   scena, se l'impostazione edit_preview è accesa) */
let PREVIEW_T = null, MULTI_ALL = true;
function tracksChanged(redraw, preview){
  DIRTY = true;
  if(preview !== undefined) PREVIEW_T = preview;
  clearTimeout(tracksTimer);
  tracksTimer = setTimeout(saveTracks, 350);
  if(redraw) renderObj();
  else updateTotals();
}
function saveTracks(){
  clearTimeout(tracksTimer);
  if(!DIRTY || SEL.kind !== 'obj') { DIRTY = false; return; }
  DIRTY = false;
  const msg = {pid: SEL.pid, data: SEL.data};
  if(SEL.multi && MULTI_ALL) msg.others = true;
  if(PREVIEW_T !== null) msg.preview = PREVIEW_T;
  PREVIEW_T = null;
  sketchup.save_tracks(JSON.stringify(msg));
}
/* Tempo locale in cui la traccia i raggiunge il suo stato j */
function keyTime(i, j){
  const tr = SEL.data.tracks[i];
  return (+tr.delay || 0) + tr.keys.slice(1, j + 1).reduce((a, k) => a + (+k.dur || 0), 0);
}
function previewKey(i, j){
  if(SEL.kind !== 'obj') return;
  if(DIRTY){ PREVIEW_T = keyTime(i, j); saveTracks(); return; }
  sketchup.preview(JSON.stringify({pid: SEL.pid, t: keyTime(i, j)}));
}

function trackCycle(t){ return t.keys.slice(1).reduce((a, k) => a + (+k.dur || 0), 0); }
function trackLen(t){ return (+t.delay || 0) + trackCycle(t) * (t.loop === 'pingpong' ? 2 : 1); }

function newId(){ return Date.now().toString(36).slice(-5) + Math.floor(Math.random() * 1296).toString(36); }

function valInput(i, j){
  const tr = SEL.data.tracks[i], p = tr.prop, k = tr.keys[j];
  if(kindOf(p) === 'bool'){
    return `<select class="sel" onchange="keyPick(${i},${j},+this.value)">
      <option value="1"${k.v >= 0.5 ? ' selected' : ''}>${esc(T('vb.on'))}</option>
      <option value="0"${k.v < 0.5 ? ' selected' : ''}>${esc(T('vb.off'))}</option></select>`;
  }
  if(kindOf(p) === 'tag'){
    const names = (SEL.tags || []).slice();
    if(!names.includes(k.v)) names.unshift(k.v);
    return `<select class="sel" onchange="keyPick(${i},${j},this.value)">`
      + names.map(n => `<option value="${escA(n)}"${n === k.v ? ' selected' : ''}>${esc(n || T('vb.untagged'))}</option>`).join('')
      + '</select>';
  }
  if(kindOf(p) === 'color'){
    return `<input type="color" class="cpick" value="${escA(k.v)}" oninput="keyColor(${i},${j},this.value,true)" onchange="keyColor(${i},${j},this.value,false)">
      <input class="nbox hex" type="text" maxlength="7" spellcheck="false" value="${escA(k.v)}" id="kh_${i}_${j}"
             onchange="keyColor(${i},${j},this.value,false)">`;
  }
  return `<input class="vbox" type="text" inputmode="decimal" autocomplete="off" value="${fmtVal(p, k.v)}"
           oninput="keyVal(${i},${j},this,false)" onchange="keyVal(${i},${j},this,true)" onblur="keyVal(${i},${j},this,true)">
    <span class="vu">${esc(unitOf(p))}</span>`;
}

function trackHTML(tr, i){
  const p = tr.prop;
  let keys = '';
  tr.keys.forEach((k, j) => {
    if(j > 0){
      keys += `<div class="ktr">↓
        <input class="vbox sm" type="text" inputmode="decimal" value="${fmtSec(k.dur)}" title="${escA(T('tr.dur'))}"
               oninput="keyDur(${i},${j},this,false)" onchange="keyDur(${i},${j},this,true)" onblur="keyDur(${i},${j},this,true)">
        <span class="vu">s</span>
        <button class="cthumb" title="${escA(T('tr.curve_h'))}" onclick="openCurve(${i},${j})">${curveThumb(k.curve, 76, 34)}</button>
        <span class="cname">${esc(presetName(k.preset))}</span>
        ${tr.keys.length > 2 ? `<button class="ibtn del ghost" title="${escA(T('tr.key_del'))}" onclick="keyDel(${i},${j})">✕</button>` : ''}
      </div>`;
    }
    keys += `<div class="kst"><button class="kdot" title="${escA(T('tr.see_h'))}" onclick="previewKey(${i},${j})"></button><span class="kl">${esc(j === 0 ? T('tr.from') : (j === tr.keys.length - 1 ? T('tr.to') : T('tr.state') + ' ' + (j + 1)))}</span>
      ${valInput(i, j)}
      <button class="ibtn ghost" title="${escA(T('tr.rest_h'))}" onclick="keyRest(${i},${j})">⌖ ${esc(T('tr.rest'))}</button>
    </div>`;
  });
  const loops = ['none','loop','pingpong'].map(l => `<option value="${l}"${tr.loop === l ? ' selected' : ''}>${esc(T('lp.' + l))}</option>`).join('');
  return `<div class="tcard${tr.on ? '' : ' off'}" data-i="${i}">
    <div class="thd">
      <label class="sw" title="${escA(T('tr.on_h'))}"><input type="checkbox"${tr.on ? ' checked' : ''} onchange="trOn(${i},this.checked)"><span class="knob"></span></label>
      <span class="tn">${esc(T('pr.' + p))}</span>
      <button class="ibtn del" title="${escA(T('tr.del'))}" onclick="trDel(${i})">✕</button>
    </div>
    <div class="tbody">
      <div class="tmeta">
        <span class="f">${esc(T('tr.delay'))}
          <input class="vbox sm" type="text" inputmode="decimal" value="${fmtSec(tr.delay)}"
                 oninput="trDelay(${i},this,false)" onchange="trDelay(${i},this,true)" onblur="trDelay(${i},this,true)"><span class="vu">s</span></span>
        <span class="f">${esc(T('tr.loop'))} <select class="sel" onchange="trLoop(${i},this.value)">${loops}</select></span>
        <span class="tot" id="ttot_${i}"></span>
      </div>
      ${keys}
      <div class="mbtns" style="margin-top:6px"><button class="ibtn" onclick="keyAdd(${i})">+ ${esc(T('tr.key_add'))}</button></div>
    </div>
  </div>`;
}

function renderObj(){
  const box = document.getElementById('objPane');
  if(!box) return;
  const s = SEL;
  if(s.kind !== 'obj'){
    const msg = s.kind === 'raw' ? T('ob.raw') : s.kind === 'multi' ? T('ob.multi').replace('{n}', s.n) : T('ob.none');
    box.innerHTML = `<div class="note">${esc(msg)}</div>`
      + (s.kind === 'raw' ? `<div class="mbtns"><button class="btn btn-sm" onclick="sketchup.make_group()">▣ ${esc(T('ob.make_group'))}</button></div>` : '');
    return;
  }
  const sec = s.type === 'section';
  const pivots = ['base','center','min','origin'].map(v =>
    `<option value="${v}"${s.data.pivot === v ? ' selected' : ''}>${esc(T('pv.' + v))}</option>`).join('');
  const used = new Set(s.data.tracks.map(t => t.prop));
  const adds = PROP_GROUPS.map(([g, ps]) => {
    ps = ps.filter(p => !sec || SECTION_PROPS.includes(p));
    if(!ps.length) return '';
    return `<optgroup label="${escA(T('prg.' + g))}">`
      + ps.map(p => `<option value="${p}"${used.has(p) ? ' disabled' : ''}>${esc(T('pr.' + p))}</option>`).join('') + '</optgroup>';
  }).join('');
  const multi = s.multi ? `<label class="multi"><input type="checkbox"${MULTI_ALL ? ' checked' : ''} onchange="MULTI_ALL=this.checked">
      ${esc(T('ob.multi_all').replace('{n}', s.multi + 1))}</label><div class="note sm">${esc(T('ob.multi_h'))}</div>` : '';
  box.innerHTML = `<div class="obhead">
      <span class="obn" title="${escA(s.name)}">${esc(s.name)}</span>
      <span class="badge">${esc(T('ob.' + s.type))}</span>
      <span class="badge live" id="obLive"${s.live ? '' : ' hidden'}>${esc(T('ob.live'))}</span>
      <span class="sp"></span>
      ${sec ? '' : `<label for="obPivot" title="${escA(T('ob.pivot_h'))}">${esc(T('ob.pivot'))}</label>
      <select class="sel" id="obPivot" title="${escA(T('ob.pivot_h'))}" onchange="pivotSet(this.value)">${pivots}</select>`}
    </div>
    ${multi}
    ${startHTML(s, sec)}
    ${s.data.tracks.length ? s.data.tracks.map(trackHTML).join('') : `<div class="empty">${esc(T('ob.empty'))}</div>`}
    <div class="addrow">
      <select class="sel" id="addProp"><option value="" disabled selected>${esc(T('ob.add_pick'))}</option>${adds}</select>
      <button class="btn btn-sm" onclick="trAdd(document.getElementById('addProp').value)">+ ${esc(T('ob.add'))}</button>
    </div>`;
  updateTotals();
}

/* Partenza (con la timeline, dopo un altro oggetto, quando lo si aziona),
   assi delle rotazioni e facce: le opzioni dell'oggetto */
function startHTML(s, sec){
  const st = s.data.start || {mode:'time', after:0, wait:0, act:'play'};
  const modes = ['time','after','trigger'].map(m => `<option value="${m}"${st.mode === m ? ' selected' : ''}>${esc(T('st.' + m))}</option>`).join('');
  let more = '';
  if(st.mode === 'after'){
    const others = (s.others || []).slice();
    const known = others.some(o => o.pid === st.after);
    const opts = (known ? '' : `<option value="0" selected>${esc(T('st.pick'))}</option>`)
      + others.map(o => `<option value="${o.pid}"${o.pid === st.after ? ' selected' : ''}>${esc(o.name)}</option>`).join('');
    more = `<select class="sel" title="${escA(T('st.after_h'))}" onchange="startSet('after', +this.value)">${opts}</select>
      <span class="f">${esc(T('st.wait'))} <input class="vbox sm" type="text" inputmode="decimal" value="${fmtSec(st.wait)}"
        onchange="startWait(this)" onblur="startWait(this)"><span class="vu">s</span></span>`;
  } else if(st.mode === 'trigger'){
    const acts = ['play','toggle'].map(a => `<option value="${a}"${st.act === a ? ' selected' : ''}>${esc(T('st.act_' + a))}</option>`).join('');
    more = `<select class="sel" title="${escA(T('st.act_h'))}" onchange="startSet('act', this.value)">${acts}</select>
      <button class="ibtn" title="${escA(T('st.use_h'))}" onclick="sketchup.use_tool()">☝ ${esc(T('st.use'))}</button>`;
  }
  const hasLook = s.data.tracks.some(t => t.prop === 'color' || t.prop === 'opacity');
  const hasRot = s.data.tracks.some(t => t.prop.startsWith('rot'));
  let opts = '';
  if(!sec && hasRot){
    opts += `<span class="f" title="${escA(T('ob.axes_h'))}">${esc(T('ob.axes'))}
      <select class="sel" onchange="SEL.data.axes=this.value;tracksChanged(false)">
        ${['object','world'].map(a => `<option value="${a}"${(s.data.axes || 'object') === a ? ' selected' : ''}>${esc(T('ax.' + a))}</option>`).join('')}
      </select></span>`;
  }
  if(!sec && hasLook){
    opts += `<label class="f" title="${escA(T('ob.faces_h'))}"><input type="checkbox"${s.data.faces ? ' checked' : ''}
      onchange="SEL.data.faces=this.checked;tracksChanged(false)"> ${esc(T('ob.faces'))}</label>`;
    if(s.data.faces && s.shared) opts += `<div class="note sm">${esc(T('ob.faces_shared'))}</div>`;
  }
  return `<div class="startrow"><span class="f" title="${escA(T('st.mode_h'))}">${esc(T('st.mode'))}
      <select class="sel" onchange="startSet('mode', this.value)">${modes}</select></span>${more}</div>`
    + (opts ? `<div class="startrow">${opts}</div>` : '');
}
function startSet(k, v){
  SEL.data.start = Object.assign({mode:'time', after:0, wait:0, act:'play'}, SEL.data.start || {});
  SEL.data.start[k] = v;
  tracksChanged(true);
}
function startWait(el){
  let v = curNum(el);
  const st = SEL.data.start || {};
  if(v === null){ el.value = fmtSec(st.wait || 0); return; }
  v = Math.max(0, Math.min(3600, v));
  el.value = fmtSec(v);
  if(v === st.wait) return;
  startSet('wait', v);
}

function updateTotals(){
  if(SEL.kind !== 'obj') return;
  SEL.data.tracks.forEach((t, i) => {
    const el = document.getElementById('ttot_' + i);
    if(el) el.textContent = T('tr.total').replace('{s}', fmtSec(trackLen(t))) + (t.loop !== 'none' ? ' ↻' : '');
  });
}

/* ── Modifiche ── */
function curNum(el){ return num(el.value); }
function trAdd(p){
  if(!p || SEL.kind !== 'obj' || SEL.data.tracks.some(t => t.prop === p)) return;
  const rest = SEL.rest[p], preset = lookVal('new_curve') || 'ease_in_out';
  SEL.data.tracks.push({id:newId(), prop:p, on:true, delay:0, loop:'none', keys:[
    {v: rest},
    {v: suggestTo(p, rest), dur: lookVal('new_duration') || 1, preset, curve: (PRESETS[preset] || PRESETS.linear).map(q => q.slice())}
  ]});
  tracksChanged(true);
}
function trDel(i){ SEL.data.tracks.splice(i, 1); tracksChanged(true); }
function trOn(i, on){
  SEL.data.tracks[i].on = on;
  document.querySelector(`.tcard[data-i="${i}"]`).classList.toggle('off', !on);
  tracksChanged(false);
}
function trLoop(i, v){ SEL.data.tracks[i].loop = v; tracksChanged(false); }
function trDelay(i, el, fin){
  let v = curNum(el);
  if(v === null){ if(fin) el.value = fmtSec(SEL.data.tracks[i].delay); return; }
  v = Math.max(0, Math.min(3600, v));
  SEL.data.tracks[i].delay = v;
  if(fin) el.value = fmtSec(v);
  tracksChanged(false);
}
function pivotSet(v){ SEL.data.pivot = v; tracksChanged(false); }
function keyVal(i, j, el, fin){
  const tr = SEL.data.tracks[i];
  let x = curNum(el);
  if(x === null){ if(fin) el.value = fmtVal(tr.prop, tr.keys[j].v); return; }
  let v = fromDisp(tr.prop, x);
  if(tr.prop.startsWith('size') || tr.prop === 'scale') v = Math.max(0.001, v);
  if(tr.prop === 'opacity') v = Math.min(1, Math.max(0, v));
  tr.keys[j].v = v;
  if(fin) el.value = fmtVal(tr.prop, v);
  tracksChanged(false, keyTime(i, j));
}
/* Visibile / tag: una scelta */
function keyPick(i, j, v){
  SEL.data.tracks[i].keys[j].v = v;
  tracksChanged(false, keyTime(i, j));
}
function keyColor(i, j, v, live){
  const n = normHex(v), tr = SEL.data.tracks[i];
  if(!n) return;
  tr.keys[j].v = n;
  const h = document.getElementById(`kh_${i}_${j}`);
  if(h && h !== document.activeElement) h.value = n;
  tracksChanged(!live, keyTime(i, j));
}
function keyRest(i, j){
  const tr = SEL.data.tracks[i];
  tr.keys[j].v = SEL.rest[tr.prop];
  tracksChanged(true, keyTime(i, j));
}
function keyDur(i, j, el, fin){
  const k = SEL.data.tracks[i].keys[j];
  let v = curNum(el);
  if(v === null){ if(fin) el.value = fmtSec(k.dur); return; }
  v = Math.max(0, Math.min(3600, v));
  k.dur = v;
  if(fin) el.value = fmtSec(v);
  tracksChanged(false);
}
function keyAdd(i){
  const tr = SEL.data.tracks[i], last = tr.keys[tr.keys.length - 1];
  const preset = lookVal('new_curve') || 'ease_in_out';
  tr.keys.push({v: kindOf(tr.prop) === 'color' ? last.v : last.v, dur: lookVal('new_duration') || 1,
                preset, curve: (PRESETS[preset] || PRESETS.linear).map(q => q.slice())});
  tracksChanged(true);
}
function keyDel(i, j){
  const tr = SEL.data.tracks[i];
  if(tr.keys.length <= 2) return;
  tr.keys.splice(j, 1);
  tracksChanged(true);
}

/* ═══════════════════════════════════════════════════════════════
   SCENA — gli oggetti animati del modello (setScene da Ruby)
═══════════════════════════════════════════════════════════════ */
let SCENE = {objects:[], total:0};
function setScene(s){ SCENE = s || {objects:[], total:0}; renderScene(); }
function renderScene(){
  const box = document.getElementById('scenePane');
  if(!box) return;
  if(!SCENE.objects.length){ box.innerHTML = `<div class="note">${esc(T('sc.empty'))}</div>`; return; }
  box.innerHTML = `<div class="note">${esc(T('sc.note'))}</div><div class="slist">`
    + SCENE.objects.map(o => `<button class="srow" data-pid="${o.pid}" onclick="pickObj(${o.pid})">
        <span class="sn">${esc(o.name)}</span>
        <span class="sd">${esc(T('sc.tracks').replace('{n}', o.n))} · ${fmtSec(o.len)} s${o.loops ? ' ↻' : ''} · ${esc(sceneStart(o))}</span>
        <span class="chips">${o.props.map(p => `<span class="chip">${esc(T('pr.' + p))}</span>`).join('')}</span>
      </button>`).join('')
    + `</div><div class="stot">${esc(T('sc.total').replace('{s}', fmtSec(SCENE.total || 0)))}</div>`;
  markSceneCur();
}
function sceneStart(o){
  if(o.mode === 'trigger') return T('sc.trigger');
  if(o.at === null || o.at === undefined) return T('sc.chain');
  return T('sc.at').replace('{s}', fmtSec(o.at));
}
function markSceneCur(){

  document.querySelectorAll('.srow').forEach(r => r.classList.toggle('cur', SEL.kind === 'obj' && +r.dataset.pid === SEL.pid));
}
function pickObj(pid){
  sketchup.select_obj(pid);
  curSub.anim = 'obj';
  if(curTab === 'anim') selSub('obj'); else selTab('anim');
}

/* ═══════════════════════════════════════════════════════════════
   EDITOR DELLE CURVE
   Punti trascinabili; doppio clic sul vuoto = nuovo punto, doppio clic
   su un punto = angolo/morbido, clic destro su un punto = via. Primo e
   ultimo punto fissi (0,0) e (1,1). Con la griglia attiva i punti vi si
   agganciano (Maiusc: liberi). Sotto, una pallina percorre la
   transizione con la curva e la durata vere.
═══════════════════════════════════════════════════════════════ */
const CV_W = 560, CV_H = 330, CV_L = 62, CV_R = 18, CV_T = 16, CV_B = 30;
let CV = null;   // {i, j, lo, hi, drag, hover, t0}

function cvKey(){ return SEL.data.tracks[CV.i].keys[CV.j]; }
function cvX(x){ return CV_L + x * (CV_W - CV_L - CV_R); }
function cvY(y){ return CV_T + (CV.hi - y) / (CV.hi - CV.lo) * (CV_H - CV_T - CV_B); }
function cvFromPx(px, py){
  return [(px - CV_L) / (CV_W - CV_L - CV_R), CV.hi - (py - CV_T) / (CV_H - CV_T - CV_B) * (CV.hi - CV.lo)];
}
function cvRange(){
  const [lo, hi] = curveBounds(cvKey().curve);
  CV.lo = Math.min(-0.15, lo - 0.12); CV.hi = Math.max(1.15, hi + 0.12);
}
function cvEvt(ev){
  const svg = document.getElementById('cvsvg'), r = svg.getBoundingClientRect();
  return cvFromPx((ev.clientX - r.left) * CV_W / r.width, (ev.clientY - r.top) * CV_H / r.height);
}
function cvSnap(x, y, ev){
  if(!lookVal('curve_snap') || (ev && ev.shiftKey)) return [x, y];
  const g = Math.max(2, Math.round(lookVal('curve_grid') || 10));
  return [Math.round(x * g) / g, Math.round(y * g * 2) / (g * 2)];
}

function openCurve(i, j){
  CV = {i, j, drag:null, hover:null, t0:performance.now()};
  cvRange();
  const tr = SEL.data.tracks[i];
  document.getElementById('cvTitle').textContent = T('cv.title');
  document.getElementById('cvHead').textContent = `${T('pr.' + tr.prop)} · ${T('cv.seg').replace('{a}', j).replace('{b}', j + 1)}`;
  document.getElementById('cvX').title = T('help.close');
  document.getElementById('cvMirror').textContent = '⇄ ' + T('cv.mirror');
  document.getElementById('cvAll').textContent = T('cv.all');
  document.getElementById('cvAll').hidden = tr.keys.length <= 2;
  document.getElementById('cvDone').textContent = T('cv.done');
  document.getElementById('cvTips').innerHTML = esc(T('cv.tips')).replace(/\[([^\]]+)\]/g, '<kbd>$1</kbd>');
  renderCurve();
  renderPresets();
  document.getElementById('curvem').classList.add('open');
  requestAnimationFrame(cvTick);
}
function closeCurve(){
  if(!CV) return;
  CV = null;
  document.getElementById('curvem').classList.remove('open');
  renderObj();
}

function renderCurve(){
  if(!CV) return;
  const svg = document.getElementById('cvsvg'), k = cvKey(), pts = k.curve;
  const g = Math.max(2, Math.round(lookVal('curve_grid') || 10));
  let s = '';
  for(let a = 0; a <= g; a++){                     // verticali (tempo)
    const x = cvX(a / g);
    s += `<line class="${a === 0 || a === g ? 'g1' : 'g'}" x1="${x}" x2="${x}" y1="${CV_T}" y2="${CV_H - CV_B}"/>`;
  }
  const y0 = Math.ceil(CV.lo * g * 2) / (g * 2);
  for(let y = y0; y <= CV.hi + 1e-9; y += 1 / (g * 2)){   // orizzontali (avanzamento)
    const yy = Math.round(y * 1000) / 1000, py = cvY(yy);
    const main = Math.abs(yy) < 1e-9 || Math.abs(yy - 1) < 1e-9;
    if(!main && Math.round(yy * g) !== yy * g) continue;
    s += `<line class="${main ? 'g1' : 'g'}" x1="${CV_L}" x2="${CV_W - CV_R}" y1="${py}" y2="${py}"/>`;
    if(main || Math.abs(yy * 2 - Math.round(yy * 2)) < 1e-9)
      s += `<text class="gl" x="${CV_L - 6}" y="${py + 4}" text-anchor="end">${main ? (yy ? T('tr.to') : T('tr.from')) : yy}</text>`;
  }
  s += `<text class="gl" x="${CV_L}" y="${CV_H - 9}">0 s</text>`
     + `<text class="gl" x="${CV_W - CV_R}" y="${CV_H - 9}" text-anchor="end">${fmtSec(k.dur)} s</text>`;
  const c = curvePrepare(pts);
  let d = '';
  for(let n = 0; n <= 200; n++){
    const u = n / 200;
    d += (n ? 'L' : 'M') + cvX(u).toFixed(1) + ' ' + cvY(curveEval(c, u)).toFixed(1);
  }
  s += `<path class="crv" d="${d}"/>`;
  s += `<line class="head" id="cvHead1" x1="0" x2="0" y1="${CV_T}" y2="${CV_H - CV_B}"/><circle class="hdot" id="cvHead2" r="4" cx="-10" cy="-10"/>`;
  pts.forEach((p, n) => {
    const end = n === 0 || n === pts.length - 1, x = cvX(p[0]), y = cvY(p[1]);
    const cls = 'pt' + (end ? ' end' : '') + (CV.drag === n ? ' drag' : '');
    s += p[2] === 1
      ? `<rect class="${cls}" data-n="${n}" x="${x - 6}" y="${y - 6}" width="12" height="12" rx="2"/>`
      : `<circle class="${cls}" data-n="${n}" cx="${x}" cy="${y}" r="7"/>`;
  });
  svg.innerHTML = s;
  document.getElementById('cvName').textContent = presetName(k.preset);
}

function renderPresets(){
  const k = cvKey();
  document.getElementById('cvPres').innerHTML = CURVE_IDS.map(id => {
    const pts = PRESETS[id] || PRESETS.linear, [lo, hi] = curveBounds(pts), m = (hi - lo) * 0.1;
    return `<button class="pbtn${k.preset === id ? ' act' : ''}" onclick="curvePreset('${id}')">
      <svg viewBox="0 0 54 30"><path d="${curvePath(pts, 54, 30, lo - m, hi + m, 3)}"/></svg>${esc(presetName(id))}</button>`;
  }).join('');
}

function curveSet(pts, preset){
  const k = cvKey();
  k.curve = curveSanitize(pts);
  k.preset = preset || 'custom';
  tracksChanged(false);
  renderCurve();
  renderPresets();
}
function curvePreset(id){
  cvKey().curve = (PRESETS[id] || PRESETS.linear).map(q => q.slice());
  cvRange();
  curveSet(cvKey().curve, id);
}
/* Specchio: accelerare ↔ decelerare (x → 1−x, y → 1−y) */
function curveMirror(){
  const pts = cvKey().curve.map(p => p[2] === 1 ? [1 - p[0], 1 - p[1], 1] : [1 - p[0], 1 - p[1]]).reverse();
  cvRange();
  curveSet(pts, 'custom');
}
/* La stessa curva su tutte le transizioni della traccia */
function curveToAll(){
  const tr = SEL.data.tracks[CV.i], k = cvKey();
  tr.keys.forEach((x, j) => { if(j > 0){ x.curve = k.curve.map(q => q.slice()); x.preset = k.preset; } });
  tracksChanged(false);
  flashStatus(T('cv.all_done'));
}

/* Pallina dell'anteprima e testina sulla curva */
function cvTick(now){
  if(!CV) return;
  const k = cvKey(), tr = SEL.data.tracks[CV.i];
  const D = Math.min(6, Math.max(0.4, +k.dur || 1)) * 1000, P = 600;
  const ph = ((now - CV.t0) % (D + P)) / D, u = Math.min(1, ph);
  const e = curveEval(curvePrepare(k.curve), u);
  const box = document.getElementById('cvPrev');
  const a = tr.keys[CV.j - 1].v, b = k.v, p = tr.prop;
  const lab = v => kindOf(p) === 'color' ? v : (fmtVal(p, v) + ' ' + unitOf(p)).trim();
  if(!box.dataset.ok){
    box.innerHTML = `<div class="rail"></div><div class="mk" style="left:15%"></div><div class="mk" style="left:85%"></div>
      <span class="lab" style="left:15%" id="cvLa"></span><span class="lab" style="left:85%" id="cvLb"></span><div class="ball" id="cvBall"></div>`;
    box.dataset.ok = 1;
  }
  document.getElementById('cvLa').textContent = lab(a);
  document.getElementById('cvLb').textContent = lab(b);
  const ball = document.getElementById('cvBall');
  ball.style.left = Math.max(1, Math.min(99, 15 + 70 * e)) + '%';
  ball.style.background = kindOf(p) === 'color' ? mixHex(a, b, e) : '';
  const h1 = document.getElementById('cvHead1'), h2 = document.getElementById('cvHead2');
  if(h1){ const x = cvX(u); h1.setAttribute('x1', x); h1.setAttribute('x2', x); h2.setAttribute('cx', x); h2.setAttribute('cy', cvY(e)); }
  requestAnimationFrame(cvTick);
}
/* Anteprima del colore: miscela semplice (il motore usa OKLab) */
function mixHex(a, b, e){
  const A = rgb(a), B = rgb(b);
  return A && B ? hex(mix(A, B, Math.min(1, Math.max(0, e)))) : a;
}

function cvShowPos(x, y){
  const k = cvKey();
  document.getElementById('cvPos').innerHTML = `${esc(T('cv.time'))} <b>${(x * k.dur).toFixed(2)} s</b> (${Math.round(x * 100)}%) · `
    + `${esc(T('cv.progress'))} <b>${Math.round(y * 100)}%</b>`;
}

function cvInit(){
  const svg = document.getElementById('cvsvg');
  svg.addEventListener('pointerdown', ev => {
    if(!CV || ev.button !== 0) return;
    const n = ev.target.dataset && ev.target.dataset.n;
    if(n === undefined) return;
    const pts = cvKey().curve;
    if(+n === 0 || +n === pts.length - 1) return;
    CV.drag = +n;
    CV.moved = false;
    ev.target.classList.add('drag');
    svg.setPointerCapture(ev.pointerId);
  });
  svg.addEventListener('pointermove', ev => {
    if(!CV) return;
    let [x, y] = cvEvt(ev);
    if(CV.drag === null){ cvShowPos(Math.min(1, Math.max(0, x)), y); return; }
    const pts = cvKey().curve, n = CV.drag;
    [x, y] = cvSnap(x, y, ev);
    x = Math.min(pts[n + 1][0] - CURVE_MIN_DX, Math.max(pts[n - 1][0] + CURVE_MIN_DX, x));
    y = Math.min(CURVE_Y_MAX, Math.max(CURVE_Y_MIN, y));
    if(!CV.moved && Math.abs(pts[n][0] - x) < 1e-9 && Math.abs(pts[n][1] - y) < 1e-9) return;
    CV.moved = true;
    pts[n][0] = x; pts[n][1] = y;
    if(y < CV.lo + 0.05 || y > CV.hi - 0.05) cvRange();
    cvKey().preset = 'custom';
    cvShowPos(x, y);
    renderCurve();
  });
  const end = () => {
    if(!CV || CV.drag === null) return;
    CV.drag = null;
    if(!CV.moved){
      document.querySelectorAll('#cvsvg .pt.drag').forEach(el => el.classList.remove('drag'));
      return;
    }
    cvRange();
    curveSet(cvKey().curve, 'custom');
  };
  svg.addEventListener('pointerup', end);
  svg.addEventListener('pointercancel', end);
  svg.addEventListener('dblclick', ev => {
    if(!CV) return;
    const pts = cvKey().curve, n = ev.target.dataset && ev.target.dataset.n;
    if(n !== undefined){
      if(+n === 0 || +n === pts.length - 1) return;
      const p = pts[+n];
      pts[+n] = p[2] === 1 ? [p[0], p[1]] : [p[0], p[1], 1];
      curveSet(pts, 'custom');
      return;
    }
    let [x, y] = cvSnap(...cvEvt(ev), ev);
    if(x <= CURVE_MIN_DX || x >= 1 - CURVE_MIN_DX) return;
    if(pts.some(p => Math.abs(p[0] - x) < CURVE_MIN_DX)) return;
    if(pts.length >= CURVE_MAX_PTS){ flashStatus(T('cv.max')); return; }
    curveSet(pts.concat([[x, y]]), 'custom');
  });
  svg.addEventListener('contextmenu', ev => {
    if(!CV) return;
    const pts = cvKey().curve, n = ev.target.dataset && ev.target.dataset.n;
    if(n === undefined || +n === 0 || +n === pts.length - 1) return;
    pts.splice(+n, 1);
    curveSet(pts, 'custom');
  });
}

/* ═══ Guida ═══
   Testi help.* in lang/*.json; le parole tra [quadre] diventano <kbd>. */
const HELP_ITEMS = 8;
function helpText(k){ return esc(T(k)).replace(/\[([^\]]+)\]/g, '<kbd>$1</kbd>'); }
function helpHTML(){
  let li = '';
  for(let i = 1; i <= HELP_ITEMS; i++) li += `<li>${helpText('help.' + i)}</li>`;
  return `<h2 id="helpTitle">${esc(T('help.title'))}</h2>
    <p>${helpText('help.intro')}</p><ul>${li}</ul>`;
}
function openHelp(){
  document.getElementById('help').classList.add('open');
  document.getElementById('helpX').focus();
}
function closeHelp(){
  document.getElementById('help').classList.remove('open');
  document.getElementById('btnHelp').focus();
}
document.addEventListener('keydown', e => {
  if(e.key !== 'Escape') return;
  if(document.getElementById('curvem').classList.contains('open')){ e.stopPropagation(); closeCurve(); }
  else if(document.getElementById('logm').classList.contains('open')){ e.stopPropagation(); closeLog(); }
  else if(document.getElementById('help').classList.contains('open')){ e.stopPropagation(); closeHelp(); }
}, true);
/* Barra spaziatrice fuori dalle caselle: Play/Pausa */
document.addEventListener('keydown', e => {
  if(e.code !== 'Space' || e.repeat) return;
  const t = e.target;
  if(t && (t.tagName === 'INPUT' || t.tagName === 'SELECT' || t.tagName === 'TEXTAREA' || t.tagName === 'BUTTON')) return;
  e.preventDefault();
  tpCmd('toggle');
});
